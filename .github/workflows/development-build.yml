name: Development Release Build

on:
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build and Publish Windows Dev Release
    runs-on: windows-latest

    steps:
      - name: Checkout development code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and publish Electron app
        run: npm run electron:build -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: JobTrack-development-windows
          path: release/**
          retention-days: 7